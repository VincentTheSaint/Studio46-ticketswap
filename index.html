<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio46 Ticketswap</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --card-hover: #1a1a1a;
    --border: #2a2a2a;
    --border-hover: #3a3a3a;
    --text: #ffffff;
    --text-secondary: #999999;
    --text-muted: #666666;
    --yellow: #FFE600;
    --yellow-dim: #b3a100;
    --radius: 14px;
    --glow: 0 0 20px rgba(255, 230, 0, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 60px; height: 60px; border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(255, 230, 0, 0.3);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .header-text h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .header-text p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

  .btn {
    padding: 12px 20px; border-radius: 12px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all 0.2s ease; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .btn-primary {
    background: var(--yellow); color: var(--bg);
  }
  .btn-primary:hover {
    background: #fff133; box-shadow: 0 0 20px rgba(255, 230, 0, 0.4);
    transform: translateY(-1px);
  }
  .btn-outline {
    background: transparent; color: var(--text); border: 1.5px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--yellow); color: var(--yellow); }
  .btn-danger {
    background: transparent; color: #ff4444; border: 1.5px solid #331111;
  }
  .btn-danger:hover { background: #331111; }
  .btn-small { padding: 8px 14px; font-size: 12px; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px;
    color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: 12px; font-size: 15px; font-family: inherit;
    background: var(--card); color: var(--text); transition: all 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(255, 230, 0, 0.1);
  }
  .form-group input::placeholder { color: var(--text-muted); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--border-hover); }
  .card-header {
    padding: 18px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .card-title { font-size: 18px; font-weight: 700; }
  .card-body { padding: 20px; }

  .event-list { display: flex; flex-direction: column; gap: 12px; }
  .event-item {
    background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
    padding: 18px; cursor: pointer; transition: all 0.2s;
    border-left: 3px solid var(--yellow);
  }
  .event-item:hover {
    border-color: var(--border-hover); transform: translateY(-2px);
    box-shadow: var(--glow);
  }
  .event-name { font-size: 17px; font-weight: 700; }
  .event-meta { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .event-stats { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .stat-dot.buy { background: #ff9800; box-shadow: 0 0 8px rgba(255, 152, 0, 0.4); }
  .stat-dot.sell { background: #4caf50; box-shadow: 0 0 8px rgba(76, 175, 80, 0.4); }
  .stat-dot.match { background: var(--yellow); box-shadow: 0 0 8px rgba(255, 230, 0, 0.4); }

  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab {
    padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700;
    cursor: pointer; border: none; background: transparent; color: var(--text-muted);
    font-family: inherit; text-transform: uppercase; letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .tab.active { background: var(--yellow); color: var(--bg); }
  .tab:hover:not(.active) { background: var(--border); color: var(--text); }

  .queue-list { display: flex; flex-direction: column; gap: 8px; }
  .queue-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-radius: 12px; background: var(--card);
    border: 1px solid var(--border); transition: all 0.2s;
  }
  .queue-item:hover { border-color: var(--border-hover); background: var(--card-hover); }
  .queue-num {
    width: 32px; height: 32px; border-radius: 50%; background: var(--yellow);
    color: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; flex-shrink: 0; margin-right: 14px;
  }
  .queue-info { flex: 1; min-width: 0; }
  .queue-name { font-weight: 700; font-size: 15px; }
  .queue-details { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .queue-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 6px;
    margin-left: 8px; flex-shrink: 0;
    background: rgba(255, 230, 0, 0.15); color: var(--yellow); border: 1px solid rgba(255, 230, 0, 0.3);
  }
  .queue-actions { display: flex; gap: 6px; margin-left: 8px; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); transition: all 0.2s;
  }
  .icon-btn:hover { background: rgba(255, 68, 68, 0.1); color: #ff4444; }
  .icon-btn svg { width: 18px; height: 18px; }
  .match-btn {
    padding: 8px 14px; border-radius: 8px; border: none; background: var(--yellow);
    color: var(--bg); font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .match-btn:hover { box-shadow: 0 0 15px rgba(255, 230, 0, 0.3); }
  .match-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  .empty {
    text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 16px; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: var(--radius); width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto; border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h2 { font-size: 18px; font-weight: 700; }
  .modal-close {
    width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--text-secondary); transition: all 0.2s;
  }
  .modal-close:hover { background: #ff4444; color: white; }
  .modal-body { padding: 20px; }
  .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--yellow); color: var(--bg); padding: 14px 24px; border-radius: 12px;
    font-size: 14px; font-weight: 700; z-index: 200; opacity: 0; transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(255, 230, 0, 0.3); text-transform: uppercase; letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .hidden { display: none !important; }
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }

  .match-card {
    background: var(--card-hover); border-radius: 12px; padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
  }
  .match-card:hover { border-color: var(--yellow); }
  .match-card h4 { font-size: 15px; margin-bottom: 6px; }
  .match-card p { font-size: 13px; color: var(--text-secondary); }

  .festival-line {
    height: 2px; background: linear-gradient(90deg, transparent, var(--yellow), transparent);
    margin: 8px 0 20px; opacity: 0.5;
  }

  h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
</style>

<div class="festival-line"></div>

<div id="eventsView">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2>Evenementen</h2>
    <button class="btn btn-primary" onclick="openModal('eventModal')">+ Nieuw evenement</button>
  </div>
  <div id="eventsList" class="event-list"></div>
  <div class="empty" id="noEvents" style="display:none;">
    Nog geen evenementen. Klik op "+ Nieuw evenement" om te beginnen.
  </div>
</div>

<div id="detailView" class="hidden">
  <button class="btn btn-outline btn-small" onclick="showEvents()" style="margin-bottom:16px;">
    ← Terug naar evenementen
  </button>

  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title" id="detailTitle">Festival</div>
        <div class="event-meta" id="detailMeta">Datum • Locatie</div>
      </div>
      <button class="btn btn-danger btn-small" onclick="deleteCurrentEvent()">Verwijder</button>
    </div>
    <div class="card-body">
      <div class="tabs">
        <button class="tab active" onclick="setTab('buy')" id="tabBuy">Zoekers</button>
        <button class="tab" onclick="setTab('sell')" id="tabSell">Aanbieders</button>
        <button class="tab" onclick="setTab('matches')" id="tabMatches">Matches</button>
      </div>

      <div id="formSection">
        <div class="form-row">
          <div class="form-group">
            <label>Jouw naam</label>
            <input type="text" id="entryName" placeholder="Bijv. Marcus" maxlength="30">
          </div>
          <div class="form-group">
            <label>Aantal tickets</label>
            <input type="number" id="entryCount" min="1" max="20" value="1">
          </div>
        </div>
        <div class="form-group">
          <label>Opmerking</label>
          <input type="text" id="entryNote" placeholder="Bijv. Early bird, VIP, tijdstip" maxlength="50">
        </div>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <button class="btn btn-primary" onclick="addEntry('buy')" id="btnAddBuy">Ik zoek ticket(s)</button>
          <button class="btn btn-outline" onclick="addEntry('sell')" id="btnAddSell" style="border-color:var(--yellow); color:var(--yellow);">Ik bied ticket(s) aan</button>
        </div>
      </div>

      <div id="matchesSection" class="hidden">
        <div id="matchesList"></div>
      </div>

      <div id="queueSection" style="margin-top:24px;">
        <div class="section-title" id="queueTitle">Wachtrij</div>
        <div id="queueList" class="queue-list"></div>
        <div class="empty" id="queueEmpty" style="display:none;">Nog niemand in deze rij.</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="eventModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Nieuw evenement</h2>
      <button class="modal-close" onclick="closeModal('eventModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Naam evenement *</label>
        <input type="text" id="eventName" placeholder="Bijv. KSA Zandvoort" maxlength="50">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Datum</label>
          <input type="date" id="eventDate">
        </div>
        <div class="form-group">
          <label>Locatie</label>
          <input type="text" id="eventLocation" placeholder="Bijv. Zandvoort" maxlength="40">
        </div>
      </div>
      <div class="form-group">
        <label>Opmerking</label>
        <input type="text" id="eventNote" placeholder="Bijv. Soort ticket, tijdstip, etc." maxlength="100">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('eventModal')">Annuleren</button>
      <button class="btn btn-primary" onclick="saveEvent()">Toevoegen</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="matchModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Match maken</h2>
      <button class="modal-close" onclick="closeModal('matchModal')">×</button>
    </div>
    <div class="modal-body">
      <p style="font-size:14px; color:var(--text-secondary); margin-bottom:16px;">
        Kies een zoeker om te matchen met dit aanbod:
      </p>
      <div id="matchOptions"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('matchModal')">Annuleren</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  const STORAGE_KEY = 'studio46_events_v3';
  let events = [];
  let currentEventId = null;
  let currentTab = 'buy';
  let pendingSellId = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) events = JSON.parse(raw);
    } catch(e) {}
    renderEvents();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function formatDate(d) {
    if (!d) return '';
    const date = new Date(d);
    return date.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function renderEvents() {
    const list = document.getElementById('eventsList');
    const empty = document.getElementById('noEvents');
    if (events.length === 0) {
      list.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    const sorted = [...events].sort((a, b) => {
      if (a.date && b.date) return new Date(a.date) - new Date(b.date);
      return (a.date ? -1 : 1);
    });
    list.innerHTML = sorted.map(ev => {
      const buyCount = (ev.buy || []).reduce((s, x) => s + (x.count || 1), 0);
      const sellCount = (ev.sell || []).reduce((s, x) => s + (x.count || 1), 0);
      const matchCount = (ev.matches || []).length;
      return `
        <div class="event-item" onclick="showEvent('${ev.id}')">
          <div class="event-name">${escapeHtml(ev.name)}</div>
          <div class="event-meta">${formatDate(ev.date)}${ev.location ? ' • ' + escapeHtml(ev.location) : ''}${ev.note ? ' • ' + escapeHtml(ev.note) : ''}</div>
          <div class="event-stats">
            <div class="stat"><span class="stat-dot buy"></span> ${buyCount} zoek${buyCount === 1 ? 't' : 'en'}</div>
            <div class="stat"><span class="stat-dot sell"></span> ${sellCount} aangeboden</div>
            ${matchCount > 0 ? `<div class="stat"><span class="stat-dot match"></span> ${matchCount} match${matchCount === 1 ? '' : 'es'}</div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  window.showEvents = function() {
    document.getElementById('eventsView').classList.remove('hidden');
    document.getElementById('detailView').classList.add('hidden');
    currentEventId = null;
    renderEvents();
  };

  window.showEvent = function(id) {
    currentEventId = id;
    const ev = events.find(e => e.id === id);
    if (!ev) return;
    document.getElementById('eventsView').classList.add('hidden');
    document.getElementById('detailView').classList.remove('hidden');
    document.getElementById('detailTitle').textContent = ev.name;
    document.getElementById('detailMeta').textContent = 
      (formatDate(ev.date) || 'Geen datum') + (ev.location ? ' • ' + ev.location : '') + (ev.note ? ' • ' + ev.note : '');
    setTab('buy');
  };

  window.deleteCurrentEvent = function() {
    if (!confirm('Dit evenement en alle wachtrijen verwijderen?')) return;
    events = events.filter(e => e.id !== currentEventId);
    save();
    showEvents();
    showToast('Evenement verwijderd');
  };

  window.setTab = function(tab) {
    currentTab = tab;
    ['buy','sell','matches'].forEach(t => {
      document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
    });
    const isMatches = tab === 'matches';
    document.getElementById('formSection').classList.toggle('hidden', isMatches);
    document.getElementById('queueSection').classList.toggle('hidden', isMatches);
    document.getElementById('matchesSection').classList.toggle('hidden', !isMatches);

    if (isMatches) renderMatches();
    else renderQueue();
  };

  function renderQueue() {
    const ev = events.find(e => e.id === currentEventId);
    if (!ev) return;
    const list = currentTab === 'buy' ? (ev.buy || []) : (ev.sell || []);
    const container = document.getElementById('queueList');
    const empty = document.getElementById('queueEmpty');
    const title = document.getElementById('queueTitle');
    const btnBuy = document.getElementById('btnAddBuy');
    const btnSell = document.getElementById('btnAddSell');

    title.textContent = currentTab === 'buy' ? 'Wie zoekt er een ticket?' : 'Wie biedt er een ticket aan?';
    btnBuy.style.display = currentTab === 'buy' ? '' : 'none';
    btnSell.style.display = currentTab === 'sell' ? '' : 'none';

    if (list.length === 0) {
      container.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    const isSellTab = currentTab === 'sell';
    container.innerHTML = list.map((item, idx) => {
      const noteStr = item.note ? ` • ${escapeHtml(item.note)}` : '';
      const matched = item.matched ? ' <span class="queue-badge">Gematcht</span>' : '';
      const matchBtn = (isSellTab && !item.matched) 
        ? `<button class="match-btn" onclick="openMatch('${item.id}')">Match</button>` 
        : '';
      return `
        <div class="queue-item">
          <div style="display:flex; align-items:center; flex:1; min-width:0;">
            <div class="queue-num">${idx + 1}</div>
            <div class="queue-info">
              <div class="queue-name">${escapeHtml(item.name)}${matched}</div>
              <div class="queue-details">${item.count || 1} ticket${(item.count || 1) > 1 ? 's' : ''}${noteStr} • ${formatTime(item.time)}</div>
            </div>
          </div>
          <div class="queue-actions">
            ${matchBtn}
            <button class="icon-btn" onclick="removeEntry('${currentTab}', '${item.id}')" title="Verwijder">
              <svg viewBox="0 0 24 24" fill="none"><path d="M8.1 3C8.1 2.5 8.5 2.1 9 2.1H15C15.5 2.1 15.9 2.5 15.9 3C15.9 3.5 15.5 3.9 15 3.9H9C8.5 3.9 8.1 3.5 8.1 3Z" fill="currentColor"/><path d="M10 15.9C9.5 15.9 9.1 15.5 9.1 15L9.1 10C9.1 9.5 9.5 9.1 10 9.1C10.5 9.1 10.9 9.5 10.9 10L10.9 15C10.9 15.5 10.5 15.9 10 15.9Z" fill="currentColor"/><path d="M13.1 15C13.1 15.5 13.5 15.9 14 15.9C14.5 15.9 14.9 15.5 14.9 15L14.9 10C14.9 9.5 14.5 9.1 14 9.1C13.5 9.1 13.1 9.5 13.1 10V15Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M2.1 6C2.1 5.5 2.5 5.1 3 5.1H21C21.5 5.1 21.9 5.5 21.9 6C21.9 6.5 21.5 6.9 21 6.9H19.8L18.8 18.7C18.7 19.9 17.7 20.9 16.5 20.9H7.5C6.3 20.9 5.3 19.9 5.2 18.7L4.2 6.9H3C2.5 6.9 2.1 6.5 2.1 6ZM6 6.9H18L17 18.5C17 18.9 16.8 19.1 16.5 19.1H7.5C7.2 19.1 7 18.9 7 18.5L6 6.9Z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.addEntry = function(type) {
    const name = document.getElementById('entryName').value.trim();
    const count = parseInt(document.getElementById('entryCount').value) || 1;
    const note = document.getElementById('entryNote').value.trim();
    if (!name) { showToast('Vul je naam in'); return; }

    const ev = events.find(e => e.id === currentEventId);
    if (!ev) return;
    if (!ev[type]) ev[type] = [];

    ev[type].push({
      id: uid(), name, count, note,
      time: Date.now(), matched: false
    });
    save();
    document.getElementById('entryName').value = '';
    document.getElementById('entryCount').value = '1';
    document.getElementById('entryNote').value = '';
    renderQueue();
    showToast(type === 'buy' ? 'Toegevoegd aan zoekers' : 'Toegevoegd aan aanbieders');
  };

  window.removeEntry = function(type, id) {
    const ev = events.find(e => e.id === currentEventId);
    if (!ev || !ev[type]) return;
    ev[type] = ev[type].filter(x => x.id !== id);
    if (ev.matches) {
      ev.matches = ev.matches.filter(m => m.buyId !== id && m.sellId !== id);
    }
    save();
    renderQueue();
    showToast('Verwijderd');
  };

  window.openMatch = function(sellId) {
    pendingSellId = sellId;
    const ev = events.find(e => e.id === currentEventId);
    if (!ev) return;
    const buyers = (ev.buy || []).filter(b => !b.matched);
    const container = document.getElementById('matchOptions');
    if (buyers.length === 0) {
      container.innerHTML = '<div class="empty">Geen ongematchte zoekers beschikbaar.</div>';
    } else {
      container.innerHTML = buyers.map(b => `
        <div class="match-card" onclick="confirmMatch('${b.id}')">
          <h4>${escapeHtml(b.name)}</h4>
          <p>${b.count || 1} ticket${(b.count || 1) > 1 ? 's' : ''}${b.note ? ' • ' + escapeHtml(b.note) : ''}</p>
        </div>
      `).join('');
    }
    openModal('matchModal');
  };

  window.confirmMatch = function(buyId) {
    const ev = events.find(e => e.id === currentEventId);
    if (!ev) return;
    const buyer = (ev.buy || []).find(b => b.id === buyId);
    const seller = (ev.sell || []).find(s => s.id === pendingSellId);
    if (!buyer || !seller) { closeModal('matchModal'); return; }

    buyer.matched = true;
    seller.matched = true;
    if (!ev.matches) ev.matches = [];
    ev.matches.push({
      id: uid(), buyId, sellId: pendingSellId,
      buyerName: buyer.name, sellerName: seller.name,
      count: Math.min(buyer.count || 1, seller.count || 1),
      time: Date.now()
    });
    save();
    closeModal('matchModal');
    renderQueue();
    showToast(`Match gemaakt: ${buyer.name} ↔ ${seller.name}`);
  };

  function renderMatches() {
    const ev = events.find(e => e.id === currentEventId);
    if (!ev) return;
    const list = document.getElementById('matchesList');
    const matches = ev.matches || [];
    if (matches.length === 0) {
      list.innerHTML = '<div class="empty">Nog geen matches. Ga naar "Aanbieders" en klik "Match" bij een ticket.</div>';
      return;
    }
    list.innerHTML = matches.map(m => `
      <div class="queue-item" style="border-left: 3px solid var(--yellow);">
        <div style="flex:1; min-width:0;">
          <div style="font-weight:700; font-size:15px;">
            ${escapeHtml(m.buyerName)} <span style="color:var(--text-secondary); font-weight:400;">ontvangt van</span> ${escapeHtml(m.sellerName)}
          </div>
          <div class="queue-details">
            ${m.count} ticket${m.count > 1 ? 's' : ''} • Gematcht op ${formatTime(m.time)}
          </div>
        </div>
        <div class="queue-actions">
          <button class="icon-btn" onclick="removeMatch('${m.id}')" title="Ongedaan maken">
            <svg viewBox="0 0 24 24" fill="none"><path d="M17.95 4.77L19.23 6.05L6.05 19.23L4.77 17.95L17.95 4.77Z" fill="currentColor"/><path d="M6.05 4.77L4.77 6.05L17.95 19.23L19.23 17.95L6.05 4.77Z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    `).join('');
  }

  window.removeMatch = function(matchId) {
    const ev = events.find(e => e.id === currentEventId);
    if (!ev || !ev.matches) return;
    const match = ev.matches.find(m => m.id === matchId);
    if (!match) return;
    const buyer = (ev.buy || []).find(b => b.id === match.buyId);
    const seller = (ev.sell || []).find(s => s.id === match.sellId);
    if (buyer) buyer.matched = false;
    if (seller) seller.matched = false;
    ev.matches = ev.matches.filter(m => m.id !== matchId);
    save();
    renderMatches();
    showToast('Match ongedaan gemaakt');
  };

  window.openModal = function(id) { document.getElementById(id).classList.add('open'); };
  window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };

  window.saveEvent = function() {
    const name = document.getElementById('eventName').value.trim();
    const date = document.getElementById('eventDate').value;
    const location = document.getElementById('eventLocation').value.trim();
    const note = document.getElementById('eventNote').value.trim();
    if (!name) { showToast('Vul een naam in'); return; }

    events.push({ id: uid(), name, date, location, note, buy: [], sell: [], matches: [] });
    save();
    document.getElementById('eventName').value = '';
    document.getElementById('eventDate').value = '';
    document.getElementById('eventLocation').value = '';
    document.getElementById('eventNote').value = '';
    closeModal('eventModal');
    renderEvents();
    showToast('Evenement toegevoegd');
  };

  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
  });

  document.getElementById('entryName').addEventListener('keypress', e => {
    if (e.key === 'Enter') addEntry(currentTab === 'buy' ? 'buy' : 'sell');
  });

  load();
})();
</script>
</body>
</html>
